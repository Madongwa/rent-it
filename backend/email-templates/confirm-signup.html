<!--
  Paste into: Supabase Dashboard -> Authentication -> Emails -> Templates
              -> "Confirm signup"
  Uses Supabase's Go-template variables ({{ .ConfirmationURL }} etc.) -
  don't change those tokens, everything else is plain HTML/copy.
-->
<div style="background-color:#f4f4f5; padding:40px 16px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <div style="max-width:480px; margin:0 auto; background-color:#ffffff; border-radius:16px; padding:40px 32px; border:1px solid #ececee;">
    <p style="margin:0 0 24px; font-size:20px; font-weight:700; color:#09090b;">🛠️ Rent It</p>

    <h1 style="margin:0 0 16px; font-size:22px; font-weight:700; color:#09090b; line-height:1.3;">
      Confirm your email
    </h1>

    <p style="margin:0 0 24px; font-size:15px; line-height:1.6; color:#52525b;">
      Thanks for signing up. Click below to confirm your address and start renting or listing
      equipment near you.
    </p>

    <a href="{{ .ConfirmationURL }}"
       style="display:inline-block; background-color:#09090b; color:#ffffff; text-decoration:none; font-size:15px; font-weight:600; padding:12px 28px; border-radius:999px;">
      Confirm my email
    </a>

    <p style="margin:32px 0 0; font-size:13px; line-height:1.6; color:#a1a1aa;">
      If you didn't create a Rent It account, you can safely ignore this email.
    </p>

    <p style="margin:16px 0 0; font-size:12px; line-height:1.6; color:#a1a1aa; word-break:break-all;">
      Or paste this link into your browser:<br />
      {{ .ConfirmationURL }}
    </p>
  </div>
</div>
